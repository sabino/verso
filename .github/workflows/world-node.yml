name: World node — reviewed image deployment

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed main commit (40 lowercase hexadecimal characters)
        required: true
        type: string
      rollback_reference:
        description: Operator-captured retention-safe rollback reference (no credentials)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: verso-world-production
  cancel-in-progress: false

jobs:
  verify-image:
    if: github.repository == 'sabino/verso' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require the exact reviewed source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          ROLLBACK_REFERENCE: ${{ inputs.rollback_reference }}
        run: |
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          node scripts/ci-world-node.mjs plan --source "$SOURCE_SHA" --digest "sha256:$(printf '%064d' 0)" --rollback-reference "$ROLLBACK_REFERENCE"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run format:check
      - run: npm run build
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish verified source image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/sabino/verso-world:${{ github.sha }}
          build-args: SOURCE_COMMIT=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Record immutable image plan
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          ROLLBACK_REFERENCE: ${{ inputs.rollback_reference }}
        run: node scripts/ci-world-node.mjs plan --source "$GITHUB_SHA" --digest "$IMAGE_DIGEST" --rollback-reference "$ROLLBACK_REFERENCE" > world-node-plan.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: world-node-plan-${{ github.sha }}
          path: world-node-plan.json
          if-no-files-found: error

  deploy:
    needs: verify-image
    if: github.repository == 'sabino/verso' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment:
      name: world-node-production
      url: https://verso-world.host.sabino.pro/health
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
      - name: Deploy with this app's token and verify exact runtime source
        env:
          CAPROVER_APP_TOKEN: ${{ secrets.CAPROVER_APP_TOKEN }}
          VERSO_WORLD_DEPLOY_ENABLED: ${{ vars.VERSO_WORLD_DEPLOY_ENABLED }}
          IMAGE_DIGEST: ${{ needs.verify-image.outputs.digest }}
          ROLLBACK_REFERENCE: ${{ inputs.rollback_reference }}
        run: node scripts/ci-world-node.mjs deploy --source "$GITHUB_SHA" --digest "$IMAGE_DIGEST" --rollback-reference "$ROLLBACK_REFERENCE" --report world-node-deployment.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: world-node-health-${{ github.sha }}
          path: world-node-deployment.json
          if-no-files-found: error
